name: Godot core checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out project
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install verified Godot 4.4.1
        shell: bash
        run: |-
          set -euo pipefail
          archive="$RUNNER_TEMP/godot-4.4.1.zip"
          curl --fail --location --retry 3 \
            --output "$archive" \
            'https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip'
          echo 'ef4e76880a514257175544952c61191106fdef3095b909bafed9fcbeb230c3e5533920a0f3012882dd4bbde83028a67549825794e2d2c3cf76eba7918b71370e  '"$archive" | sha512sum --check --status
          unzip -q "$archive" -d "$RUNNER_TEMP/godot"
          executable="$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"
          chmod +x "$executable"
          version="$("$executable" --version)"
          echo "Godot: $version"
          [[ "$version" == 4.4.1.stable.official.* ]]
          echo "GODOT=$executable" >> "$GITHUB_ENV"

      - name: Import project and check for errors
        shell: bash
        run: |-
          set -euo pipefail
          "$GODOT" --headless --path . --import 2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          if grep -E '(^|[[:space:]])(SCRIPT ERROR|ERROR):' "$RUNNER_TEMP/godot-import.log"; then
            exit 1
          fi

      - name: Check generated script UIDs are tracked
        shell: bash
        run: |-
          set -euo pipefail
          missing=0
          while IFS= read -r -d '' script; do
            uid_file="$script.uid"
            if [[ ! -f "$uid_file" ]]; then
              echo "::error title=Missing Godot UID::$uid_file was not generated by Godot."
              missing=1
            elif ! git ls-files --error-unmatch "$uid_file" > /dev/null 2>&1; then
              printf '::error title=Untracked Godot UID::%s = %s\n' "$uid_file" "$(tr -d '\r\n' < "$uid_file")"
              missing=1
            fi
          done < <(find scripts tests -type f -name '*.gd' -print0)
          exit "$missing"

      - name: Run CORE-01 state and save tests
        shell: bash
        run: |-
          set -euo pipefail
          "$GODOT" --headless --path . res://tests/core/core_test.tscn 2>&1 | tee "$RUNNER_TEMP/godot-core.log"
          if grep -E '(^|[[:space:]])(SCRIPT ERROR|ERROR):' "$RUNNER_TEMP/godot-core.log"; then
            exit 1
          fi

      - name: Regression check of the BASE-01 checks
        run: '"$GODOT" --headless --path . --script res://tests/base/base_test.gd'
